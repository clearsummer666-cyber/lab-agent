# ============ lab-agent 生产部署编排 ============
# 启动方式（必须带 --env-file，配置都在 deploy.env 里）：
#   docker compose --env-file deploy.env up -d --build
#
# 三个服务：
#   db      MySQL 8.0，数据落在命名卷 mysql_data
#   backend FastAPI，只在容器网络 + 宿主 127.0.0.1 上暴露 8000
#   web     Nginx，托管前端静态文件并把 /api、/uploads 反代给 backend，对外开 80/443
name: lab-agent

services:
  db:
    image: mysql:8.0
    container_name: lab-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy.env 里必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lab_agent}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 后端启动时会立刻 Base.metadata.create_all()，必须等 MySQL 真正能连了再放行
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [lab-net]

  backend:
    build: ./backend
    image: lab-agent-backend:latest
    container_name: lab-backend
    restart: unless-stopped
    environment:
      # 容器内用服务名 db 连库（不是 127.0.0.1），charset 显式指定避免中文乱码
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-lab_agent}?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?deploy.env 里必须设置 JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      LLM_API_KEY: ${LLM_API_KEY:?deploy.env 里必须设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.agnes-ai.cn/v1}
      LLM_MODEL: ${LLM_MODEL:-agnes-2.5-flash}
      TZ: Asia/Shanghai
      # 向量模型下载走国内镜像
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      # 上传文件持久化到宿主机，容器重建不丢
      - ./backend/uploads:/app/uploads
      # Chroma 向量库：首启会自动从 data/kb/*.md 重建，所以用命名卷即可
      - chroma_data:/app/data/chroma
      # embedding 模型缓存，避免每次重建镜像都重新下载 ~100MB
      - hf_cache:/root/.cache/huggingface
    ports:
      # 只绑宿主机回环，公网一律走 Nginx。要调试用 SSH 隧道，别直接开公网。
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [lab-net]

  web:
    build: ./frontend
    image: lab-agent-web:latest
    container_name: lab-web
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?deploy.env 里必须设置 SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks: [lab-net]

volumes:
  mysql_data:
  chroma_data:
  hf_cache:

networks:
  lab-net:
    driver: bridge
